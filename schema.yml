components:
  schemas:
    AttachmentTypeEnum:
      enum:
      - CLINICAL_IMAGE
      - REPORT_DOCUMENT
      - SUPPORTING_DOCUMENT
      type: string
      description: |-
        * `CLINICAL_IMAGE` - Clinical Image
        * `REPORT_DOCUMENT` - Report Document
        * `SUPPORTING_DOCUMENT` - Supporting Document
    Consultation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_number:
          type: string
          readOnly: true
        doctor:
          type: string
          format: uuid
          readOnly: true
        doctor_name:
          type: string
          readOnly: true
        consultation_date:
          type: string
          format: date-time
        chief_complaint:
          type: string
        symptoms:
          type: string
        clinical_findings:
          type: string
        assessment:
          type: string
        treatment_plan:
          type: string
        follow_up_notes:
          type: string
        status:
          allOf:
