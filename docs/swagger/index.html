<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediBridge API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; font-family: Arial, sans-serif; }
    .topbar { background: #17365d; padding: 18px 24px; color: #fff; }
    .topbar h1 { margin: 0; font-size: 22px; font-weight: 600; }
    .topbar p { margin: 6px 0 0; color: #e6edf5; font-size: 13px; }
    #swagger-ui { max-width: 1440px; margin: 0 auto; }
    .notice { max-width: 1440px; margin: 16px auto 0; padding: 12px 20px; color: #374151; font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>MediBridge API</h1>
    <p>Healthcare coordination and AI-assisted diagnostics backend</p>
  </header>
  <div class="notice">
    Public, read-only API reference. The API server is not hosted by this static documentation page.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script>
    window.addEventListener('load', function () {
      window.ui = SwaggerUIBundle({
        url: './openapi.yml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        docExpansion: 'none',
        defaultModelsExpandDepth: 1,
        supportedSubmitMethods: [],
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout'
      });
    });
  </script>
</body>
</html>
